function escape(value = '') { return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function Button({label,href,variant='dark',external=false,type='button',attributes=''}) {
  const content = `<span class="button-label">${escape(label)}</span><span class="button-disc" aria-hidden="true"><span class="button-motion">↗</span></span>`;
  return href ? `<a class="button button--${variant}" href="${escape(href)}" ${external?'target="_blank" rel="noopener noreferrer"':''} ${attributes}>${content}</a>` : `<button class="button button--${variant}" type="${type}" ${attributes}>${content}</button>`;
}
const Badge = label => `<span class="badge"><span aria-hidden="true"></span>${escape(label)}</span>`;
function Heading({label,title,description='',action}) {
  return `<div class="section-heading">${label?Badge(label):''}<div class="section-heading-row"><div><h2>${title}</h2>${description?`<p>${escape(description)}</p>`:''}</div>${action?Button(action):''}</div></div>`;
}
function PageHero({label,title,description,action,center=false}) {

/** Single Card component for all card usages. Variants share one base and tokens. */
function Card({variant='project',title,description='',image='',imageClass='',href='',category='',meta='',body='',tags=[],label='View Work',attributes=''}) {
  const media=image?`<div class="card-media ${escape(imageClass)}"><img src="${escape(image)}" alt="${escape(title)}" loading="lazy" decoding="async">${href?`<span class="card-hover" aria-hidden="true">${escape(label)}</span>`:''}</div>`:'';
  const content=`${media}<div class="card-copy"><div class="card-title-row"><h3>${escape(title)}</h3>${category?`<span>${escape(category)}</span>`:''}</div>${meta?`<p class="card-meta">${escape(meta)}</p>`:''}${description?`<p>${escape(description)}</p>`:''}${body}${tags.length?`<div class="tags">${tags.map(tag=>`<span>${escape(tag)}</span>`).join('')}</div>`:''}</div>`;
  return `<article class="card card--${escape(variant)}" ${attributes}>${href?`<a class="card-link" href="${escape(href)}" aria-label="${escape(label+': '+title)}">${content}</a>`:content}</article>`;
}
function Field({name,label,type='text',placeholder='',multiline=false,required=true}) {
  const attrs=`id="${name}" name="${name}" ${required?'required':''} placeholder="${escape(placeholder)}"`;
  return `<div class="field"><label class="sr-only" for="${name}">${escape(label)}</label>${multiline?`<textarea ${attrs} rows="6" maxlength="5000"></textarea>`:`<input type="${type}" ${attrs} maxlength="${type==='email'?254:120}" autocomplete="${type==='email'?'email':name==='name'?'name':'off'}">`}</div>`;
}
function Stat({value,label,note=''}) { return `<div class="stat"><strong>${escape(value)}</strong><span>${escape(label)}</span>${note?`<small>${escape(note)}</small>`:''}</div>`; }

}
function NotePage(n) {
  return PageHero({label:'Design Note',title:escape(n.title),description:n.lead})+`<section class="section"><article class="container note-story"><p>${Badge(n.category)}</p><img class="note-cover" src="${n.image}" alt="${escape(n.title)}">${n.paragraphs.map(p=>`<p>${escape(p)}</p>`).join('')}${Button({label:'Explore the Project',href:`/work/${n.project}/`,variant:'accent'})}</article></section>`+Notes({all:true});
}
function StyleGuide() {
  return PageHero({label:'Style Guide',title:'One system.<br><span>Every page.</span>',description:'The colours, type, spacing and components shared across this portfolio.'})+`<section class="section"><div class="container style-guide">${Heading({label:'Foundations',title:'Design <span>Tokens</span>'})}<div class="swatches">${[['Canvas','--color-canvas'],['Surface','--color-surface'],['Ink','--color-ink'],['Muted','--color-muted'],['Dark','--color-dark'],['Accent','--color-accent']].map(([name,token])=>`<div><span style="background:var(${token})"></span><p>${name}</p><code>${token}</code></div>`).join('')}</div><h2>Shared Components</h2><div class="component-demo">${Button({label:'Primary Button',href:'/contact/',variant:'dark'})}${Button({label:'Accent Button',href:'/contact/',variant:'accent'})}${Badge('Section Label')}</div><div class="project-grid">${projectCard(projects[0])}${Card({variant:'skill',title:'One Card component',description:'Projects, skills, case studies, notes and contact cards use the same base component.',tags:['Shared tokens','Named variants']})}</div><h2>Typography</h2><h1>Heading one</h1><h2>Heading two</h2><h3>Heading three</h3><p>Schibsted Grotesk. A shared scale, consistent line height and considered spacing.</p></div></section>`;
}
const NotFound = () => PageHero({label:'404',title:'This page <span>isn’t here.</span>',description:'Explore my selected work or get in touch.',action:{label:'Back to Home',href:'/',variant:'accent'}});

let previewPath='/';
function renderPreview(){
const path = previewPath;
const routes={'/':Home,'/about-me/':About,'/service/':ServicePage,'/case-study/':CasePage,'/blog/':BlogPage,'/contact/':Contact,'/style-guide/':StyleGuide};
let render=routes[path],title=path==='/'?'Product Designer':path.split('/')[1].replaceAll('-',' ');
if(path.startsWith('/work/')) {const p=projects.find(p=>path===`/work/${p.id}/`); if(p){render=()=>ProjectPage(p);title=p.name;}}
if(path.startsWith('/notes/')) {const n=notes.find(n=>path===`/notes/${n.id}/`); if(n){render=()=>NotePage(n);title=n.title;}}
document.title=`${title.charAt(0).toUpperCase()+title.slice(1)} — ${person.name}`;
document.getElementById('app').innerHTML=Header(path)+`<main id="main">${(render||NotFound)()}</main>`+Footer();

const menu=document.querySelector('.menu-toggle'),nav=document.querySelector('.primary-navigation');
function closeMenu(){menu.setAttribute('aria-expanded','false');menu.setAttribute('aria-label','Open navigation');nav.classList.remove('is-open');}
menu.addEventListener('click',()=>{const expanded=menu.getAttribute('aria-expanded')!=='true';menu.setAttribute('aria-expanded',expanded);menu.setAttribute('aria-label',expanded?'Close navigation':'Open navigation');nav.classList.toggle('is-open',expanded);});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&menu.getAttribute('aria-expanded')==='true'){closeMenu();menu.focus();}});
document.addEventListener('click',event=>{if(!event.target.closest('.site-header'))closeMenu();});
window.matchMedia('(min-width: 992px)').addEventListener('change',event=>{if(event.matches)closeMenu();});

document.querySelectorAll('[data-accordion]').forEach(details=>details.addEventListener('toggle',()=>{if(details.open)document.querySelectorAll('[data-accordion]').forEach(other=>{if(other!==details)other.open=false;});}));
const tabs=[...document.querySelectorAll('[data-tab]')];
function selectTab(index){tabs.forEach((tab,i)=>{tab.classList.toggle('is-active',i===index);tab.setAttribute('aria-selected',i===index);tab.tabIndex=i===index?0:-1;document.getElementById(tab.getAttribute('aria-controls')).hidden=i!==index;});}
tabs.forEach((tab,i)=>{tab.addEventListener('click',()=>selectTab(i));tab.addEventListener('keydown',event=>{let next;if(event.key==='ArrowRight')next=(i+1)%tabs.length;else if(event.key==='ArrowLeft')next=(i+tabs.length-1)%tabs.length;else if(event.key==='Home')next=0;else if(event.key==='End')next=tabs.length-1;if(next!==undefined){event.preventDefault();selectTab(next);tabs[next].focus();}});});
document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{const category=button.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>{b.classList.toggle('is-active',b===button);b.setAttribute('aria-pressed',b===button);});let count=0;document.querySelectorAll('.project-grid .card--project').forEach((card,i)=>{const visible=category==='All'||projects[i].category===category;card.hidden=!visible;if(visible)count++;});document.querySelector('[data-filter-status]').textContent=`Showing ${count} ${category==='All'?'':category+' '}projects`;}));
const form=document.getElementById('contact-form');
form?.addEventListener('submit',event=>{event.preventDefault();if(!form.reportValidity())return;const data=new FormData(form);const subject=`Portfolio enquiry from ${data.get('name')}`;const body=`Hi Jamiu,\n\n${data.get('message')}\n\n${data.get('name')}\n${data.get('email')}`;location.href=`mailto:${person.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;const status=document.getElementById('form-status');status.hidden=false;status.textContent=`An email draft was requested. If your email app did not open, email ${person.email} directly. Nothing has been sent from this page.`;});

// Progressive enhancement: content remains visible if IntersectionObserver is unavailable.
if('IntersectionObserver' in window&&!matchMedia('(prefers-reduced-motion: reduce)').matches){const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('is-visible');observer.unobserve(entry.target);}}),{threshold:0.05});document.querySelectorAll('.section-heading,.card,.experience-row').forEach(element=>{element.classList.add('reveal');observer.observe(element);});}

document.querySelectorAll('a[href^="/"]').forEach(a=>{a.href='#'+a.getAttribute('href');});
}
window.addEventListener('hashchange',()=>{if(location.hash.startsWith('#/')){previewPath=location.hash.slice(1).split('#')[0];renderPreview();window.scrollTo(0,0);}});
if(location.hash.startsWith('#/'))previewPath=location.hash.slice(1);
renderPreview();</script>
</body>
</html>
