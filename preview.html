          "A super-app that earns the breadth it claims: five financial products sharing one balance, one visual language and one standard of disclosure. Constraints appear before commitment, projections are labelled as projections, and empty states teach rather than stall — so consolidation makes the user's financial picture clearer instead of merely shorter."
        ],
        "images": []
      },
      {
        "title": "08 The evidence",
        "paragraphs": [
          "One balance anchors the home screen rather than five. Constraints are surfaced before commitment rather than reported as failures afterwards, projections are labelled as estimates with tax status stated at the point of decision, and empty states explain the product rather than reporting zero. The full presentation is published on Behance."
        ],
        "images": []
      },
      {
        "title": "09 What I’d test next",
        "paragraphs": [
          "I would test whether people actually read indicative value at maturity as an estimate rather than a promise — that phrase is carrying a lot of weight, and its comprehension is testable in minutes. I would also check whether masking the balance by default helps or irritates in daily use, since it trades a small constant cost against a privacy benefit that only matters occasionally."
        ],
        "images": []
      }
    ]
  },
  {
    "id": "project-management-dashboard",
    "name": "Reporting Portal",
    "image": "/projects/pm-dashboard-laptop.jpg",
    "sections": [
      {
        "title": "01 The short version",
        "paragraphs": [
          "Reporting Portal is a project management dashboard built around a KPI-first overview: a key-metrics row for total projects, tasks due, at-risk and critical items; a filter bar across project, team, date range and status; and a task board moving work through To Do, In Progress, Review and Done alongside upcoming milestones. It ships in light and dark themes and adapts down to mobile. This is a selected project rather than a full case study — the complete presentation is published on Behance."
        ],
        "images": []
      },
      {
        "title": "02 What I owned",
        "paragraphs": [
          "I designed the reporting portal's dashboard and information architecture: the key-metrics row, the filter model, the four-state task board, the milestone view and the responsive layout, in both light and dark themes."
        ],
        "images": []
      },
      {
        "title": "03 The challenge",
        "paragraphs": [
          "A reporting dashboard is opened to answer one question — what needs attention today — but it is usually built to answer a different one: how much work exists. Totals are easy to produce and reassuring to look at, and they tell a manager nothing they can act on. The design problem was to decide what earns the top of the screen when the person reading it is scanning, not studying, and often doing it on a phone between meetings."
        ],
        "images": []
      },
      {
        "title": "04 The tricky part",
        "paragraphs": [
          "Prioritising risk means accepting an uncomfortable default: the dashboard opens by showing what is going wrong. That is the honest view and it is not the one a stakeholder demoing the tool tends to want, so the metrics row had to earn its order — total projects stays, because context matters, but tasks due, at-risk and critical sit alongside it rather than beneath it. The second constraint was breadth: four filter dimensions, four task states, milestones and two themes all had to survive being compressed onto a phone without becoming a stack of disconnected cards."
        ],
        "images": []
      },
      {
        "title": "05 Discovery to design decisions",
        "paragraphs": [
          "What belongs above the fold on a dashboard whose users are scanning rather than reading.",
          "Totals are reassuring and useless; the useful figures are the ones that imply an action — what is due, what is at risk, what is critical.",
          "The key-metrics row leads with tasks due, at-risk and critical items rather than a project count, and milestones sit beside the board rather than in a separate view.",
          "Whether the four task states match how teams really move work, or whether they need a blocked state."
        ],
        "images": []
      },
      {
        "title": "07 What changed",
        "paragraphs": [
          "A dashboard that opens on the work needing attention rather than on a summary of everything: risk and due-date pressure at the top, a four-state board that surfaces work waiting on a person, milestones in the same view, and a filter model that answers a manager's real questions. It holds up in light and dark and down to a phone."
        ],
        "images": []
      },
      {
        "title": "08 The evidence",
        "paragraphs": [
          "The metrics row leads with tasks due, at-risk and critical items rather than totals; Review exists as its own column so blocked work is visible; and the layout survives both themes and a mobile breakpoint. The full presentation is published on Behance."
        ],
        "images": []
      },
      {
        "title": "09 What I’d test next",
        "paragraphs": [
          "Test whether managers can identify the day's at-risk items within a few seconds of opening the dashboard, and whether four task states are sufficient in practice or whether teams need a blocked state distinct from Review."
        ],
        "images": []
      }
    ]
  }

// These are the only UI primitives. Pages compose them; they do not duplicate them.
function escape(value = '') { return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function Button({label,href,variant='dark',external=false,type='button',attributes=''}) {
  const content = `<span class="button-label">${escape(label)}</span><span class="button-disc" aria-hidden="true"><span class="button-motion">↗</span></span>`;
  return href ? `<a class="button button--${variant}" href="${escape(href)}" ${external?'target="_blank" rel="noopener noreferrer"':''} ${attributes}>${content}</a>` : `<button class="button button--${variant}" type="${type}" ${attributes}>${content}</button>`;
}
const Badge = label => `<span class="badge"><span aria-hidden="true"></span>${escape(label)}</span>`;
function Heading({label,title,description='',action}) {
  return `<div class="section-heading">${label?Badge(label):''}<div class="section-heading-row"><div><h2>${title}</h2>${description?`<p>${escape(description)}</p>`:''}</div>${action?Button(action):''}</div></div>`;
}
function PageHero({label,title,description,action,center=false}) {
  return `<section class="page-hero ${center?'page-hero--center':''}"><div class="container"><nav class="breadcrumb" aria-label="Breadcrumb"><a href="/">Home</a><span aria-hidden="true">›</span><span>${escape(label)}</span></nav><h1>${title}</h1><div class="page-hero-bottom"><p>${escape(description)}</p>${action?Button(action):''}</div></div></section>`;
}
/** Single Card component for all card usages. Variants share one base and tokens. */
function Card({variant='project',title,description='',image='',imageClass='',href='',category='',meta='',body='',tags=[],label='View Work',attributes=''}) {
  const media=image?`<div class="card-media ${escape(imageClass)}"><img src="${escape(image)}" alt="${escape(title)}" loading="lazy" decoding="async">${href?`<span class="card-hover" aria-hidden="true">${escape(label)}</span>`:''}</div>`:'';
  const content=`${media}<div class="card-copy"><div class="card-title-row"><h3>${escape(title)}</h3>${category?`<span>${escape(category)}</span>`:''}</div>${meta?`<p class="card-meta">${escape(meta)}</p>`:''}${description?`<p>${escape(description)}</p>`:''}${body}${tags.length?`<div class="tags">${tags.map(tag=>`<span>${escape(tag)}</span>`).join('')}</div>`:''}</div>`;
  return `<article class="card card--${escape(variant)}" ${attributes}>${href?`<a class="card-link" href="${escape(href)}" aria-label="${escape(label+': '+title)}">${content}</a>`:content}</article>`;
}
function Field({name,label,type='text',placeholder='',multiline=false,required=true}) {
  const attrs=`id="${name}" name="${name}" ${required?'required':''} placeholder="${escape(placeholder)}"`;
  return `<div class="field"><label class="sr-only" for="${name}">${escape(label)}</label>${multiline?`<textarea ${attrs} rows="6" maxlength="5000"></textarea>`:`<input type="${type}" ${attrs} maxlength="${type==='email'?254:120}" autocomplete="${type==='email'?'email':name==='name'?'name':'off'}">`}</div>`;
}
function Stat({value,label,note=''}) { return `<div class="stat"><strong>${escape(value)}</strong><span>${escape(label)}</span>${note?`<small>${escape(note)}</small>`:''}</div>`; }

}
function StyleGuide() {
  return PageHero({label:'Style Guide',title:'One system.<br><span>Every page.</span>',description:'The colours, type, spacing and components shared across this portfolio.'})+`<section class="section"><div class="container style-guide">${Heading({label:'Foundations',title:'Design <span>Tokens</span>'})}<div class="swatches">${[['Canvas','--color-canvas'],['Surface','--color-surface'],['Ink','--color-ink'],['Muted','--color-muted'],['Dark','--color-dark'],['Accent','--color-accent']].map(([name,token])=>`<div><span style="background:var(${token})"></span><p>${name}</p><code>${token}</code></div>`).join('')}</div><h2>Shared Components</h2><div class="component-demo">${Button({label:'Primary Button',href:'/contact/',variant:'dark'})}${Button({label:'Accent Button',href:'/contact/',variant:'accent'})}${Badge('Section Label')}</div><div class="project-grid">${projectCard(projects[0])}${Card({variant:'skill',title:'One Card component',description:'Projects, skills, case studies, notes and contact cards use the same base component.',tags:['Shared tokens','Named variants']})}</div><h2>Typography</h2><h1>Heading one</h1><h2>Heading two</h2><h3>Heading three</h3><p>Schibsted Grotesk. A shared scale, consistent line height and considered spacing.</p></div></section>`;
}
const NotFound = () => PageHero({label:'404',title:'This page <span>isn’t here.</span>',description:'Explore my selected work or get in touch.',action:{label:'Back to Home',href:'/',variant:'accent'}});

const portfolioPages = [
  {id:'credentials',name:'Certifications & recognition',description:'Training, awards and references from the people I have worked with.'},
  {id:'brand',name:'Brand & identity',description:'Brand guidelines, visual identities and investor presentations.'},
  {id:'logos',name:'Logos & marks',description:'UXD and HERLUX identities, from the mark to its applications.'},
  {id:'system',name:'Design systems',description:'Foundations, reusable components and production handoff documentation.'},
  {id:'ai',name:'AI practice',description:'Model evaluation, AI product design and agent workflows.'}
];
function ExplorePortfolio(){return `<section class="section surface-section"><div class="container">${Heading({label:'Explore More',title:'Beyond <span>the case studies.</span>'})}<nav class="collection-links" aria-label="Extended portfolio">${portfolioPages.map(p=>Button({label:p.name,href:`/${p.id}/`})).join('')}</nav></div></section>`;}
function documentURL(url){return url.startsWith('/')?asset(url.slice(1)):url;}
function evidenceLink(link){const path=link.href.split('#')[0];const internal=portfolioPages.some(p=>path===`/${p.id}/`)||path==='/academic-proofreader/'||path.startsWith('/work/');return `<a class="text-link" href="${escape(internal?path:documentURL(link.href))}" ${internal?'':'target="_blank" rel="noopener noreferrer"'}>${escape(link.label)}</a>`;}
function CollectionPage(id){
 const p=portfolioPages.find(p=>p.id===id);
 return PageHero({label:p.name,title:escape(p.name),description:p.description})+`<section class="section"><div class="container"><nav class="collection-links" aria-label="Extended portfolio">${portfolioPages.map(p=>`<a class="collection-pill" href="/${p.id}/" ${p.id===id?'aria-current="page"':''}>${escape(p.name)}</a>`).join('')}</nav>${collections[id].map(group=>`<section class="collection-group">${Heading({title:escape(group.title)})}<div class="collection-grid">${group.cards.map(c=>Card({variant:'document',title:c.title,description:c.description,image:c.image?documentURL(c.image):'',meta:c.meta,body:`<div class="document-actions">${c.links.map(evidenceLink).join('')}</div>${c.gallery.length>1?`<details class="document-gallery"><summary>Browse all ${c.gallery.length} pages</summary><div>${c.gallery.map((src,i)=>`<a href="${escape(documentURL(src))}" target="_blank" rel="noopener noreferrer"><img src="${escape(documentURL(src))}" alt="${escape(c.title)} — page ${i+1}" loading="lazy"></a>`).join('')}</div></details>`:''}`})).join('')}</div></section>`).join('')}</div></section>`+CTA();
}
function MoreWork(){return `<section class="section"><div class="container">${Heading({label:'More Projects',title:'More of <span>the work.</span>'})}<div class="collection-grid">${extendedProjects.map(p=>Card({title:p.name,image:p.image?documentURL(p.image):'',href:`/work/${p.id}/`,label:'Read Case Study'})).join('')}</div></div></section>`;}
function ExtendedProjectPage(p){return PageHero({label:p.name,title:escape(p.name),description:'From my extended portfolio.'})+`<section class="section"><article class="container extended-story">${p.sections.map(s=>`<section class="collection-group"><h2>${escape(s.title)}</h2>${s.paragraphs.map(p=>`<p>${escape(p)}</p>`).join('')}<div class="artifact-grid">${s.images.map(src=>`<a href="${escape(documentURL(src))}" target="_blank" rel="noopener noreferrer"><img src="${escape(documentURL(src))}" alt="${escape(p.name+' — '+s.title)}" loading="lazy"></a>`).join('')}</div></section>`).join('')}</article></section>`+MoreWork()+CTA();}
function AcademicProofreader(){return PageHero({label:'Academic Proofreader',title:'Your research.<br><span>Your voice.</span>',description:'Careful academic editing for students and researchers. A plugin I built, with public release in preparation.'})+`<section class="section"><div class="container"><div class="collection-grid">${[['Small, useful edits','Grammar, punctuation, clarity and flow, with meaning, citations and technical terminology preserved.'],['Attribution stays intact','Suggestions retain attribution and flag questions or source issues for review.'],['You approve the rewrite','Substantial rewrites are presented separately for author approval.']].map(([title,description])=>Card({variant:'decision',title,description})).join('')}</div><div class="collection-group"><h2>How to begin</h2><p>Provide a section of research you wrote, your assignment brief and institutional AI policy where available. Review the changes before using the text.</p><p>British English is the default. The plugin does not invent findings or references, certify university compliance or guarantee AI-detector scores.</p>${Button({label:'Contact for Support',href:'mailto:'+person.email,variant:'accent'})}</div></div></section>`+ExplorePortfolio();}

let previewPath='/';
function renderPreview(){
const path = previewPath;
const routes={'/':Home,'/about-me/':About,'/service/':ServicePage,'/case-study/':CasePage,'/blog/':BlogPage,'/contact/':Contact,'/style-guide/':StyleGuide};
['credentials','brand','logos','system','ai'].forEach(id=>routes[`/${id}/`]=()=>CollectionPage(id));
routes['/certificates/']=routes['/credentials/'];
routes['/academic-proofreader/']=AcademicProofreader;
let render=routes[path],title=path==='/'?'Product Designer':path.split('/')[1].replaceAll('-',' ');
if(path.startsWith('/work/')) {const p=projects.find(p=>path===`/work/${p.id}/`); if(p){render=()=>ProjectPage(p);title=p.name;}}
if(path.startsWith('/work/')&&!render){const p=extendedProjects.find(p=>path===`/work/${p.id}/`);if(p){render=()=>ExtendedProjectPage(p);title=p.name;}}
if(path.startsWith('/notes/')) {const n=notes.find(n=>path===`/notes/${n.id}/`); if(n){render=()=>NotePage(n);title=n.title;}}
document.title=`${title.charAt(0).toUpperCase()+title.slice(1)} — ${person.name}`;
document.getElementById('app').innerHTML=Header(path)+`<main id="main">${(render||NotFound)()}</main>`+Footer();

const menu=document.querySelector('.menu-toggle'),nav=document.querySelector('.primary-navigation');
function closeMenu(){menu.setAttribute('aria-expanded','false');menu.setAttribute('aria-label','Open navigation');nav.classList.remove('is-open');}
menu.addEventListener('click',()=>{const expanded=menu.getAttribute('aria-expanded')!=='true';menu.setAttribute('aria-expanded',expanded);menu.setAttribute('aria-label',expanded?'Close navigation':'Open navigation');nav.classList.toggle('is-open',expanded);});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&menu.getAttribute('aria-expanded')==='true'){closeMenu();menu.focus();}});
document.addEventListener('click',event=>{if(!event.target.closest('.site-header'))closeMenu();});
window.matchMedia('(min-width: 992px)').addEventListener('change',event=>{if(event.matches)closeMenu();});

document.querySelectorAll('[data-accordion]').forEach(details=>details.addEventListener('toggle',()=>{if(details.open)document.querySelectorAll('[data-accordion]').forEach(other=>{if(other!==details)other.open=false;});}));
const tabs=[...document.querySelectorAll('[data-tab]')];
function selectTab(index){tabs.forEach((tab,i)=>{tab.classList.toggle('is-active',i===index);tab.setAttribute('aria-selected',i===index);tab.tabIndex=i===index?0:-1;document.getElementById(tab.getAttribute('aria-controls')).hidden=i!==index;});}
tabs.forEach((tab,i)=>{tab.addEventListener('click',()=>selectTab(i));tab.addEventListener('keydown',event=>{let next;if(event.key==='ArrowRight')next=(i+1)%tabs.length;else if(event.key==='ArrowLeft')next=(i+tabs.length-1)%tabs.length;else if(event.key==='Home')next=0;else if(event.key==='End')next=tabs.length-1;if(next!==undefined){event.preventDefault();selectTab(next);tabs[next].focus();}});});
document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{const category=button.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>{b.classList.toggle('is-active',b===button);b.setAttribute('aria-pressed',b===button);});let count=0;document.querySelectorAll('.project-grid .card--project').forEach((card,i)=>{const visible=category==='All'||projects[i].category===category;card.hidden=!visible;if(visible)count++;});document.querySelector('[data-filter-status]').textContent=`Showing ${count} ${category==='All'?'':category+' '}projects`;}));
const form=document.getElementById('contact-form');
form?.addEventListener('submit',event=>{event.preventDefault();if(!form.reportValidity())return;const data=new FormData(form);const subject=`Portfolio enquiry from ${data.get('name')}`;const body=`Hi Jamiu,\n\n${data.get('message')}\n\n${data.get('name')}\n${data.get('email')}`;location.href=`mailto:${person.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;const status=document.getElementById('form-status');status.hidden=false;status.textContent=`An email draft was requested. If your email app did not open, email ${person.email} directly. Nothing has been sent from this page.`;});

// Progressive enhancement: content remains visible if IntersectionObserver is unavailable.
if('IntersectionObserver' in window&&!matchMedia('(prefers-reduced-motion: reduce)').matches){const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('is-visible');observer.unobserve(entry.target);}}),{threshold:0.05});document.querySelectorAll('.section-heading,.card,.experience-row').forEach(element=>{element.classList.add('reveal');observer.observe(element);});}

document.querySelectorAll('a[href^="/"]').forEach(a=>{a.href=location.href.split('#')[0]+'#'+a.getAttribute('href');});
}
window.addEventListener('hashchange',()=>{if(location.hash.startsWith('#/')){previewPath=location.hash.slice(1).split('#')[0];renderPreview();window.scrollTo(0,0);}});
if(location.hash.startsWith('#/'))previewPath=location.hash.slice(1);
renderPreview();</script>
</body>
</html>
